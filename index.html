<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printo Çmimet (30x25mm)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<!-- Importojmë disa fonte nga Google Fonts që të kemi opsione të bukura -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
  .card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  
  /* Pamja në ekran e etiketës (30x25mm) */
  .preview-label {
    width: 30mm;
    height: 25mm;
    background: #fff;
    border: 2px dashed #cbd5e1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    overflow: hidden;
  }
  
  /* Stili për çmim me CENT */
  .price-format-cents {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .price-cents-euro {
    letter-spacing: -1px;
  }

  .price-cents-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-left: 2px;
  }

  .price-cents-top {
    border-bottom: 2px solid #000;
    padding-bottom: 1px;
    margin-bottom: 1px;
    line-height: 1;
    width: 100%;
    text-align: center;
  }

  .price-cents-bottom {
    line-height: 1;
  }

  /* Stili për çmim numër të plotë */
  .price-format-whole {
    color: #000;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: -2px;
  }

  /* Fshih panelin gjatë printimit */
  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="no-print">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Printo Çmimin (30×25mm)</h3>
    <button class="btn btn-primary btn-lg" onclick="printEtiketat()">
      <i class="bi bi-printer"></i> Printo
    </button>
  </div>

  <div class="card p-4 mb-4">
    <div class="row g-4 align-items-end">
      <div class="col-md-4">
        <label class="form-label fw-bold">Shkruaj Çmimin (€)</label>
        <div class="input-group input-group-lg">
          <input type="number" step="0.01" min="0" id="priceInput" class="form-control" placeholder="p.sh. 2, 1.50, 20" value="2" oninput="updatePreview()">
          <span class="input-group-text bg-light fw-bold fs-5">€</span>
        </div>
      </div>
      
      <div class="col-md-2">
        <label class="form-label fw-bold">Sa etiketa?</label>
        <input type="number" id="copiesInput" class="form-control form-control-lg" min="1" max="100" value="1" oninput="updatePreview()">
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Zgjidh Fontin</label>
        <select id="fontSelect" class="form-select form-select-lg" onchange="updatePreview()">
          <option value="Arial, sans-serif">Arial (Standard)</option>
          <option value="'Roboto', sans-serif">Roboto</option>
          <option value="'Montserrat', sans-serif">Montserrat</option>
          <option value="'Oswald', sans-serif">Oswald (I ngushtë)</option>
          <option value="'Inter', sans-serif">Inter</option>
          <option value="Impact, sans-serif">Impact (Shumë i trashë)</option>
          <option value="'Times New Roman', serif">Times New Roman (Serif)</option>
          <option value="'Courier New', monospace">Courier New (Monospace)</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Trashësia</label>
        <div class="d-flex gap-2">
          <select id="weightSelect" class="form-select form-select-lg" onchange="updatePreview()">
            <option value="900">Shumë i trashë (Black)</option>
            <option value="700">I trashë (Bold)</option>
            <option value="400">Normal</option>
            <option value="300">I hollë (Light)</option>
          </select>
          <button class="btn btn-outline-secondary" onclick="document.getElementById('priceInput').value=''; updatePreview();">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card p-4 text-center">
    <h6 class="mb-3 text-muted">👁️ Pamja paraprake (30×25mm)</h6>
    <div class="preview-label" id="previewLabel">
      <div id="previewContainer"></div>
    </div>
  </div>
</div>

<script>
// Funksioni që krijon HTML-in e brendshëm bazuar në çmimin, fontin dhe trashësinë
function generatePriceHTML(priceStr, fontFamily, weight) {
  let num = parseFloat(priceStr);
  if (isNaN(num)) num = 0;

  let hasCents = (num % 1 !== 0);

  if (hasCents) {
    let whole = Math.floor(num);
    let cents = Math.round((num - whole) * 100);
    let centsStr = cents.toString().padStart(2, '0');

    let wholeStr = whole.toString();
    let fontSizeWhole = 85;
    if (wholeStr.length === 2) fontSizeWhole = 65;
    if (wholeStr.length >= 3) fontSizeWhole = 50;

    let fontSizeTop = fontSizeWhole * 0.4;
    let fontSizeBottom = fontSizeWhole * 0.45;

    return `
      <div class="price-format-cents" style="font-family: ${fontFamily}; font-weight: ${weight};">
        <div class="price-cents-euro" style="font-size: ${fontSizeWhole}px;">${whole}</div>
        <div class="price-cents-right">
          <div class="price-cents-top" style="font-size: ${fontSizeTop}px; width: ${fontSizeTop * 1.3}px;">${centsStr}</div>
          <div class="price-cents-bottom" style="font-size: ${fontSizeBottom}px;">€</div>
        </div>
      </div>
    `;
  } else {
    let numStr = num.toString();
    let fontSize = 90;
    
    if (numStr.length === 2) fontSize = 75; // U rrit pak nga 70 ne 75 për t'u dukur më mirë
    if (numStr.length === 3) fontSize = 55;
    if (numStr.length >= 4) fontSize = 40;

    return `<div class="price-format-whole" style="font-family: ${fontFamily}; font-weight: ${weight}; font-size: ${fontSize}px;">${num}€</div>`;
  }
}

// Përditëson pamjen paraprake
function updatePreview() {
  let price = document.getElementById('priceInput').value;
  let container = document.getElementById('previewContainer');
  let fontFamily = document.getElementById('fontSelect').value;
  let weight = document.getElementById('weightSelect').value;
  
  // Aplikojmë fontin edhe tek kutia e pamjes paraprake që të duket njësoj
  document.getElementById('previewLabel').style.fontFamily = fontFamily;
  
  if (price === '' || isNaN(price)) {
    container.innerHTML = generatePriceHTML('0', fontFamily, weight);
  } else {
    container.innerHTML = generatePriceHTML(price, fontFamily, weight);
  }
}

// Funksioni për të printuar
function printEtiketat() {
  let price = document.getElementById('priceInput').value;
  let copies = parseInt(document.getElementById('copiesInput').value);
  let fontFamily = document.getElementById('fontSelect').value;
  let weight = document.getElementById('weightSelect').value;

  if (isNaN(price) || price < 0 || price === '') {
    alert('Ju lutem shkruani një çmim të saktë!');
    return;
  }
  if (isNaN(copies) || copies < 1) {
    copies = 1;
  }

  let priceHTML = generatePriceHTML(price, fontFamily, weight);

  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print Çmimi</title>';
  
  // Importojmë fontet edhe në iframe që të printohen saktë
  html += '<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">';
  
  html += '<style>';
  html += '@page { size: 30mm 25mm; margin: 0; }';
  html += 'html, body { margin:0; padding:0; background:#fff; }';
  
  html += '.label { width:30mm; height:25mm; box-sizing:border-box; ' +
          'display:flex; align-items:center; justify-content:center; ' +
          'page-break-after:always; page-break-inside:avoid; margin:0; padding:0; overflow:hidden; }';
  html += '.label:last-child { page-break-after:auto; }';
  
  html += `
    .price-format-cents { display: flex; align-items: center; justify-content: center; line-height: 1; }
    .price-cents-euro { letter-spacing: -1px; }
    .price-cents-right { display: flex; flex-direction: column; justify-content: center; align-items: center; margin-left: 2px; }
    .price-cents-top { border-bottom: 2px solid #000; padding-bottom: 1px; margin-bottom: 1px; line-height: 1; text-align: center; }
    .price-cents-bottom { line-height: 1; }
    .price-format-whole { color: #000; line-height: 1; white-space: nowrap; letter-spacing: -2px; }
  `;
  
  html += '</style></head><body>';

  for (let i = 0; i < copies; i++) {
    html += '<div class="label">' + priceHTML + '</div>';
  }

  html += '<script>';
  html += 'window.onload = function() {';
  // Presim pak me shume qe fontet te ngarkohen mire nga Google Fonts
  html += '  setTimeout(function(){ window.print(); }, 500);'; 
  html += '};';
  html += '<\/script></body></html>';

  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;
}

window.addEventListener('load', updatePreview);
</script>
</body>
</html>
