<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printo Çmimet (30x25mm)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
  body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
  .card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  
  /* Pamja në ekran e etiketës */
  .preview-label {
    width: 30mm;
    height: 25mm;
    background: #fff;
    border: 2px dashed #cbd5e1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    overflow: hidden;
  }
  
  /* Stili i shkrimit të çmimit - shumë i madh dhe bold */
  .price-text {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 85px; /* Madhësi e madhe për t'u lexuar qartë */
    font-weight: 900;
    color: #000;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: -2px; /* E afron shenjën e euros me numrin */
  }

  /* Fshih panelin gjatë printimit */
  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="no-print">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Printo Çmimin (30×25mm)</h3>
    <button class="btn btn-primary btn-lg" onclick="printEtiketat()">
      <i class="bi bi-printer"></i> Printo
    </button>
  </div>

  <div class="card p-4 mb-4">
    <div class="row g-4 align-items-end">
      <div class="col-md-6">
        <label class="form-label fw-bold">Shkruaj Çmimin (€)</label>
        <div class="input-group input-group-lg">
          <input type="number" step="0.01" min="0" id="priceInput" class="form-control" placeholder="p.sh. 2" value="2" oninput="updatePreview()">
          <span class="input-group-text bg-light fw-bold fs-5">€</span>
        </div>
      </div>
      
      <div class="col-md-3">
        <label class="form-label fw-bold">Sa etiketa?</label>
        <input type="number" id="copiesInput" class="form-control form-control-lg" min="1" max="100" value="1" oninput="updatePreview()">
      </div>

      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100 btn-lg" onclick="window.location.reload()">
          <i class="bi bi-arrow-counterclockwise"></i> Pastro
        </button>
      </div>
    </div>
  </div>

  <div class="card p-4 text-center">
    <h6 class="mb-3 text-muted">👁️ Pamja paraprake (30×25mm)</h6>
    <div class="preview-label">
      <span class="price-text" id="previewPrice">2€</span>
    </div>
  </div>
</div>

<script>
// Përditëson pamjen paraprake kur shkruan
function updatePreview() {
  let price = document.getElementById('priceInput').value;
  if (price === '' || isNaN(price)) {
    price = '0';
  }
  
  // Nëse ka .00 në fund, e heq (p.sh 2.00 -> 2, 2.50 -> 2.50)
  let num = parseFloat(price);
  let textPrice = num % 1 === 0 ? num.toString() : num.toFixed(2);

  document.getElementById('previewPrice').textContent = textPrice + '€';
}

// Funksioni për të printuar
function printEtiketat() {
  let price = document.getElementById('priceInput').value;
  let copies = parseInt(document.getElementById('copiesInput').value);

  if (isNaN(price) || price < 0) {
    alert('Ju lutem shkruani një çmim të saktë!');
    return;
  }
  if (isNaN(copies) || copies < 1) {
    copies = 1;
  }

  let num = parseFloat(price);
  let textPrice = num % 1 === 0 ? num.toString() : num.toFixed(2);
  let finalPrice = textPrice + '€';

  // Ndërtojmë HTML-in për printim
  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print Çmimi</title>';
  html += '<style>';
  // CSS për format 30x25mm - plotësisht pa margjina
  html += '@page { size: 30mm 25mm; margin: 0; }';
  html += 'html, body { margin:0; padding:0; background:#fff; font-family: Arial, Helvetica, sans-serif; }';
  
  // Kuti për secilën etiketë
  html += '.label { width:30mm; height:25mm; box-sizing:border-box; ' +
          'display:flex; align-items:center; justify-content:center; ' +
          'page-break-after:always; page-break-inside:avoid; margin:0; padding:0; overflow:hidden; }';
  html += '.label:last-child { page-break-after:auto; }';
  
  // Stili i tekstit të çmimit - i madh, bold, pa hapësira të panevojshme
  html += '.price { font-size: 80px; font-weight: 900; color: #000; ' +
          'line-height: 1; white-space: nowrap; letter-spacing: -2px; }';
  html += '</style></head><body>';

  // Shtojmë aq etiketa sa kërkon përdoruesi
  for (let i = 0; i < copies; i++) {
    html += '<div class="label"><span class="price">' + finalPrice + '</span></div>';
  }

  // Shtojmë script për të nisur printimin automatikisht
  html += '<script>';
  html += 'window.onload = function() {';
  html += '  setTimeout(function(){ window.print(); }, 300);';
  html += '};';
  html += '<\/script></body></html>';

  // Krijojmë iframe të fshehur për printim
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;
}

// Nis preview kur hapet faqja
window.addEventListener('load', updatePreview);
</script>
</body>
</html>
