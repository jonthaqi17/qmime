<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printimi i Etiketave me Çmim - 30x25mm</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
.card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }

/* Pamja në ekran për etiketat */
.label-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap:8px;
  margin-top:10px;
}
.label-preview {
  width: 30mm;
  height: 25mm;
  border: 1px dashed #cbd5e1;
  border-radius:4px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1mm;
  box-sizing:border-box;
  overflow:hidden;
  margin: 0 auto;
}
.label-preview .emri {
  font-size: 8px;
  font-weight: 700;
  line-height: 1;
  text-align: center;
  max-width: 28mm;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
}
.label-preview .cmimi-big {
  font-size: 13px;
  font-weight: 900;
  color: #000;
  line-height: 1.1;
  margin: 1px 0;
}
.label-preview svg { max-width: 100%; height: auto; display:block; }

/* Inputi i çmimit */
.price-input {
  width: 110px;
  text-align: right;
  font-weight: 700;
  font-size: 15px;
}
.copies-input {
  width: 55px;
  text-align: center;
  font-weight: bold;
}

/* Fshih elementet gjatë printimit */
@media print {
  .no-print { display: none !important; }
}
</style>
</head>
<body>

<!-- PANELI I KONTROLLIT -->
<div class="no-print" id="uiArea">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Printimi i Etiketave me Çmim <small class="text-muted fs-6">(30×25mm)</small></h3>
    <div>
      <button class="btn btn-outline-secondary" onclick="window.location.href='./'">
        <i class="bi bi-arrow-left"></i> Kthehu
      </button>
      <button class="btn btn-primary" onclick="printEtiketat()">
        <i class="bi bi-printer"></i> Printo Etiketat
      </button>
    </div>
  </div>

  <!-- Kërkimi & filtrat -->
  <div class="card p-3 mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label">Kërko produkt</label>
        <input id="searchInput" class="form-control" placeholder="Emri ose barkodi..." oninput="loadProduktet()">
      </div>
      <div class="col-md-3">
        <label class="form-label">Kategoria</label>
        <select id="katSelect" class="form-select" onchange="loadProduktet()">
          <option value="">Të gjitha</option>
          <option>CD</option>
          <option>USB</option>
          <option>SD Card</option>
          <option>Zmadhues Zëri</option>
          <option>Aksesor</option>
          <option>Adapter</option>
          <option>Kabllo Telefoni</option>
          <option>Çanta</option>
          <option>Tjetër</option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label">Çmimi i etiketës (për të gjitha të zgjedhurat)</label>
        <div class="d-flex gap-2">
          <input type="number" step="0.01" min="0" id="globalPrice" class="form-control price-input" placeholder="0.00" value="">
          <span class="form-control d-flex align-items-center justify-content-center" style="width:45px; background:#f3f4f6;">€</span>
          <button class="btn btn-warning" onclick="applyGlobalPrice()">
            <i class="bi bi-cash-coin"></i> Apliko
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Info & numëruesi -->
  <div class="card p-3 mb-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><span id="infoText" class="text-muted">Duke u ngarkuar...</span></div>
      <div class="d-flex gap-2">
        <span class="badge bg-primary" id="selectedCount">0 të zgjedhur</span>
        <span class="badge bg-success" id="totalLabels">0 etiketa</span>
      </div>
    </div>
  </div>

  <!-- Lista e produkteve -->
  <div class="card p-3 mb-3" style="max-height:420px; overflow-y:auto;">
    <h6 class="mb-3">📦 Zgjidh produktet, vendos çmimin dhe sasinë:</h6>
    <div id="prodList"></div>
  </div>

  <!-- Preview i etiketave -->
  <div class="card p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">👁️ Pamje paraprake e etiketave</h6>
      <small class="text-muted">Format: 30×25mm për printer 420B</small>
    </div>
    <div class="label-grid" id="labelPreview"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rhkaqtpfhcyajyslnvln.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoa2FxdHBmaGN5YWp5c2xudmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Mzc1OTQsImV4cCI6MjA5MDMxMzU5NH0.oaObjuascv482VGXD7p-loOZY048mt1LbwJlWcZyCSE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let PRODUKTET = [];
let SELECTED = new Set();
let COPIES = {};        // id -> sasia e etiketave
let PRICES = {};        // id -> çmimi i etiketës (override)

// Kontroll autentikimi
async function checkAuth() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert('Duhet të hysh si admin!');
    window.location.href = './';
    return false;
  }
  const { data: prof } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!prof || prof.roli !== 'admin') {
    alert('Vetëm admini ka qasje!');
    window.location.href = './';
    return false;
  }
  return true;
}

// Ngarko produktet
async function loadProduktet() {
  const q = document.getElementById('searchInput').value.trim();
  const kat = document.getElementById('katSelect').value;
  let query = db.from('produktet').select('*').order('emri');
  if (q) query = query.or('emri.ilike.%' + q + '%,barkodi.ilike.%' + q + '%');
  if (kat) query = query.eq('kategoria', kat);
  const { data, error } = await query;
  if (error) {
    document.getElementById('prodList').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
    return;
  }
  PRODUKTET = data || [];
  renderLista();
  renderPreview();
}

// Render lista
function renderLista() {
  const list = document.getElementById('prodList');
  if (!PRODUKTET.length) {
    list.innerHTML = '<p class="text-muted">Nuk ka produkte.</p>';
    document.getElementById('infoText').textContent = '0 produkte';
    return;
  }
  document.getElementById('infoText').textContent = PRODUKTET.length + ' produkte të gjetura';

  list.innerHTML = PRODUKTET.map(p => {
    const checked = SELECTED.has(p.id) ? 'checked' : '';
    const sasia = COPIES[p.id] || 1;
    const price = PRICES[p.id] !== undefined ? PRICES[p.id] : Number(p.cmimi_shitjes || 0);

    return '<div class="d-flex align-items-center mb-2 p-2 border rounded flex-wrap gap-2">' +
      '<div class="form-check m-0 flex-grow-1">' +
        '<input class="form-check-input" type="checkbox" id="chk_' + p.id + '" ' + checked +
        ' onchange="toggleSelect(' + p.id + ')">' +
        '<label class="form-check-label w-100" for="chk_' + p.id + '" style="cursor:pointer">' +
        '<b>' + p.emri + '</b> ' +
        '<small class="text-muted">• <code>' + p.barkodi + '</code>' +
        (p.kategoria ? ' • ' + p.kategoria : '') +
        ' • Stok: ' + p.sasia + '</small>' +
        '</label>' +
      '</div>' +
      '<div class="d-flex align-items-center gap-1">' +
        '<small class="text-muted">Çmimi:</small>' +
        '<input type="number" step="0.01" min="0" class="form-control form-control-sm price-input" ' +
        'value="' + price.toFixed(2) + '" onchange="updatePrice(' + p.id + ', this.value)" ' +
        'onclick="event.stopPropagation()">' +
        '<span class="text-muted">€</span>' +
      '</div>' +
      '<div class="d-flex align-items-center gap-1">' +
        '<small class="text-muted">Kopje:</small>' +
        '<input type="number" class="form-control form-control-sm copies-input" min="1" max="100" value="' + sasia + '" ' +
        'onchange="updateCopies(' + p.id + ', this.value)" onclick="event.stopPropagation()">' +
      '</div>' +
      '</div>';
  }).join('');

  updateCount();
}

function toggleSelect(id) {
  if (SELECTED.has(id)) SELECTED.delete(id);
  else {
    SELECTED.add(id);
    if (PRICES[id] === undefined) {
      const p = PRODUKTET.find(x => x.id === id);
      if (p) PRICES[id] = Number(p.cmimi_shitjes || 0);
    }
  }
  updateCount();
  renderPreview();
}

function updatePrice(id, val) {
  let num = parseFloat(val);
  if (isNaN(num) || num < 0) num = 0;
  PRICES[id] = num;

  // Auto-zgjidh nëse ndryshon çmimin
  if (!SELECTED.has(id)) {
    SELECTED.add(id);
    const chk = document.getElementById('chk_' + id);
    if (chk) chk.checked = true;
    updateCount();
  }
  renderPreview();
}

function updateCopies(id, val) {
  let num = parseInt(val);
  if (isNaN(num) || num < 1) num = 1;
  if (num > 100) num = 100;
  COPIES[id] = num;

  if (!SELECTED.has(id)) {
    SELECTED.add(id);
    const chk = document.getElementById('chk_' + id);
    if (chk) chk.checked = true;
    updateCount();
  }
  renderPreview();
}

function applyGlobalPrice() {
  const val = parseFloat(document.getElementById('globalPrice').value);
  if (isNaN(val) || val < 0) {
    alert('Shkruaj një çmim të saktë!');
    return;
  }
  if (!SELECTED.size) {
    alert('Zgjidh së paku një produkt!');
    return;
  }
  SELECTED.forEach(id => { PRICES[id] = val; });
  renderLista();
  renderPreview();
  alert('Çmimi ' + val.toFixed(2) + ' € u aplikua për ' + SELECTED.size + ' produkte.');
}

function updateCount() {
  document.getElementById('selectedCount').textContent = SELECTED.size + ' të zgjedhur';
  let total = 0;
  SELECTED.forEach(id => total += (COPIES[id] || 1));
  document.getElementById('totalLabels').textContent = total + ' etiketa';
}

// Ndërto listën me të gjitha etiketat (duke përfshirë kopjet)
function buildLabelList() {
  const list = [];
  PRODUKTET.filter(p => SELECTED.has(p.id)).forEach(p => {
    const sasia = COPIES[p.id] || 1;
    const cmimi = PRICES[p.id] !== undefined ? PRICES[p.id] : Number(p.cmimi_shitjes || 0);
    for (let i = 0; i < sasia; i++) {
      list.push({ ...p, cmimi_etikete: cmimi });
    }
  });
  return list;
}

// Render preview në ekran
function renderPreview() {
  const container = document.getElementById('labelPreview');
  const labels = buildLabelList();

  if (!labels.length) {
    container.innerHTML = '<p class="text-muted text-center p-4">Zgjidh produkte për të parë etiketat.</p>';
    return;
  }

  container.innerHTML = labels.map(p =>
    '<div class="label-preview">' +
    '<div class="emri">' + p.emri + '</div>' +
    '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>' +
    '<div class="cmimi-big">' + p.cmimi_etikete.toFixed(2) + ' €</div>' +
    '</div>'
  ).join('');

  document.querySelectorAll('.label-preview .barcode').forEach(svg => {
    try {
      JsBarcode(svg, svg.getAttribute('data-barkod'), {
        format: 'CODE128',
        width: 1.1,
        height: 22,
        fontSize: 9,
        displayValue: true,
        margin: 0,
        lineColor: '#000',
        background: '#fff'
      });
    } catch (e) {
      console.error('Gabim barkod:', e);
    }
  });
}

// PRINTIMI — hap iframe të pavarur me format 30x25mm
function printEtiketat() {
  const labels = buildLabelList();
  if (!labels.length) {
    alert('Zgjidh së paku një produkt për të printuar!');
    return;
  }

  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Etiketa Çmimesh</title>';
  html += '<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>';
  html += '<style>';
  // Format ekzakt 30x25mm për printer 420B
  html += '@page { size: 30mm 25mm; margin: 0; }';
  html += 'html, body { margin:0; padding:0; background:#fff; font-family: Arial, Helvetica, sans-serif; }';
  html += '.label { width:30mm; height:25mm; box-sizing:border-box; padding:1mm; ' +
          'display:flex; flex-direction:column; align-items:center; justify-content:center; ' +
          'page-break-after:always; page-break-inside:avoid; overflow:hidden; margin:0; }';
  html += '.label:last-child { page-break-after:auto; }';
  html += '.emri { font-size:7.5px; font-weight:700; line-height:1; text-align:center; ' +
          'max-width:28mm; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; ' +
          'margin-bottom:0.5mm; }';
  html += '.cmimi { font-size:13px; font-weight:900; color:#000; line-height:1; ' +
          'margin-top:0.5mm; letter-spacing:0.2px; }';
  html += 'svg { display:block; max-width:100%; height:auto; }';
  html += '<\/style><\/head><body>';

  labels.forEach(p => {
    html += '<div class="label">';
    html += '<div class="emri">' + p.emri + '</div>';
    html += '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>';
    html += '<div class="cmimi">' + p.cmimi_etikete.toFixed(2) + ' €</div>';
    html += '</div>';
  });

  html += '<script>';
  html += 'window.onload = function() {';
  html += '  document.querySelectorAll(".barcode").forEach(function(svg) {';
  html += '    try {';
  html += '      JsBarcode(svg, svg.getAttribute("data-barkod"), {';
  html += '        format:"CODE128", width:1.1, height:22, fontSize:9,';
  html += '        displayValue:true, margin:0, lineColor:"#000", background:"#fff"';
  html += '      });';
  html += '    } catch(e) { console.error(e); }';
  html += '  });';
  html += '  setTimeout(function(){ window.print(); }, 700);';
  html += '};';
  html += '<\/script></body></html>';

  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;

  // Pastrim i iframe pas printimit
  iframe.onload = () => {
    setTimeout(() => {
      try { iframe.contentWindow.focus(); } catch(e) {}
    }, 800);
  };
}

// Nisja
window.addEventListener('load', async () => {
  const ok = await checkAuth();
  if (!ok) return;
  await loadProduktet();
});
</script>
</body>
</html>
